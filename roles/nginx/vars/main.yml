# Internal values of luminare.infra_edge.nginx (not meant to be overridden).

# Supported managed hosts: distribution -> major version.
nginx_supported_platforms:
  Debian: ["13"]
  Ubuntu: ["24"]

# Debian's layout of /etc/nginx, which the role keeps: the role owns nginx.conf and writes one
# file per site into sites-available, enabled by a symlink in sites-enabled.
nginx_conf_file: /etc/nginx/nginx.conf
nginx_sites_available_dir: /etc/nginx/sites-available
nginx_sites_enabled_dir: /etc/nginx/sites-enabled
nginx_log_dir: /var/log/nginx

# The first line of every site file the role writes. A file in sites-available that starts with
# it but whose site is no longer in nginx_sites is removed together with its symlink.
nginx_site_marker: "# Site of luminare.infra_edge.nginx"

# The dynamic stream module; Debian and Ubuntu enable it in /etc/nginx/modules-enabled.
nginx_stream_package: libnginx-mod-stream

# Firewall drop-in of the base role's layout: number 20 is the web server's.
nginx_firewall_dropin_dir: /etc/nftables.d
nginx_firewall_dropin: /etc/nftables.d/20-nginx.nft
nginx_firewall_ruleset: /etc/nftables.conf

# Input checks (assert.yml). Values end up in nginx configuration files, so they may not
# contain spaces, quotes, semicolons or braces unless noted.
nginx_name_pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
nginx_server_name_pattern: '^[A-Za-z0-9*_.-]+( [A-Za-z0-9*_.-]+)*$'
# A loopback listener: 127.x.x.x or [::1], with a port.
nginx_loopback_listen_pattern: '^(127(\.[0-9]{1,3}){3}|\[::1\]):[0-9]{1,5}$'
# A stream listener: a port, or address:port.
nginx_stream_listen_pattern: '^(([0-9]{1,3}(\.[0-9]{1,3}){3}|\[[0-9A-Fa-f:.]+\]):)?[0-9]{1,5}$'
nginx_upstream_url_pattern: '^http://([A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?(/[A-Za-z0-9._~/%-]*)?$'
nginx_upstream_address_pattern: '^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\]):[0-9]{1,5}$'
nginx_cidr_pattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*(/[0-9]{1,3})?)$'
nginx_size_pattern: '^[0-9]+[kKmMgG]?$'
nginx_time_pattern: '^[0-9]+(ms|s|m|h|d)?$'
nginx_header_name_pattern: '^[A-Za-z0-9-]+$'
# Header values are written in double quotes: no quote, backslash, $ or control character.
nginx_header_value_pattern: '^[^"\\$\x00-\x1f\x7f]+$'
