# Handlers run after the last task, so a reload only follows a configuration that passed nginx -t
# (tasks/service.yml). Handler names are global in a play, so they name nginx.

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded

# The firewall is restarted only when it runs: the role never starts a firewall that the base
# role (or an operator) left stopped. Restarting nftables loads /etc/nftables.conf again, which
# flushes the whole ruleset, including the table of fail2ban, so a running fail2ban is
# restarted after it.
- name: Read the state of nftables for the nginx relays
  ansible.builtin.systemd_service:
    name: nftables.service
  register: nginx_nftables_state
  listen: Reload the firewall for the nginx relays

- name: Restart nftables with the nginx drop-in
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
  when: nginx_nftables_state.status.ActiveState == 'active'
  listen: Reload the firewall for the nginx relays

- name: Read the state of fail2ban after the nginx firewall change
  ansible.builtin.systemd_service:
    name: fail2ban.service
  register: nginx_fail2ban_state
  when: nginx_nftables_state.status.ActiveState == 'active'
  listen: Reload the firewall for the nginx relays

- name: Restart fail2ban after the nginx firewall change
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted
  when:
    - nginx_nftables_state.status.ActiveState == 'active'
    - nginx_fail2ban_state.status.ActiveState == 'active'
  listen: Reload the firewall for the nginx relays
