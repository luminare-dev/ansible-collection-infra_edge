# Handler names are global in a play, so they name MariaDB. service.yml flushes them once after
# the server started, so a restart for a changed tuning file runs before the role changes
# accounts; the others run at the end of the play.

# mariadb.service has Type=notify: the restart returns when the server is ready, and fails when
# the server refuses its configuration.
- name: Restart mariadb
  ansible.builtin.systemd_service:
    name: "{{ mariadb_service }}"
    state: restarted

- name: Read the state of mariadb after the restart
  ansible.builtin.systemd_service:
    name: "{{ mariadb_service }}"
  register: mariadb_restarted_state
  listen: Restart mariadb

- name: Check that mariadb runs after the restart
  ansible.builtin.assert:
    that:
      - mariadb_restarted_state.status.ActiveState == 'active'
    fail_msg: >-
      {{ mariadb_service }} is {{ mariadb_restarted_state.status.ActiveState }} after the restart; see
      "journalctl -u {{ mariadb_service }}" on the host.
    quiet: true
  listen: Restart mariadb

# A changed OnCalendar takes effect with the next start of the timer.
- name: Restart the mariadb dump timer
  ansible.builtin.systemd_service:
    name: mariadb-dump.timer
    state: restarted
    daemon_reload: true
  when:
    - mariadb_dump_enabled
    - mariadb_dump_timer_stat.stat.exists or not ansible_check_mode

# The firewall is restarted only when it runs: the role never starts a firewall that the base
# role (or an operator) left stopped. Restarting nftables loads /etc/nftables.conf again, which
# flushes the whole ruleset, including the table of fail2ban, so a running fail2ban is
# restarted after it.
- name: Read the state of nftables for the mariadb app hosts
  ansible.builtin.systemd_service:
    name: nftables.service
  register: mariadb_nftables_state
  listen: Reload the firewall for the mariadb app hosts

- name: Restart nftables with the mariadb drop-in
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
  when: mariadb_nftables_state.status.ActiveState == 'active'
  listen: Reload the firewall for the mariadb app hosts

- name: Read the state of fail2ban after the mariadb firewall change
  ansible.builtin.systemd_service:
    name: fail2ban.service
  register: mariadb_fail2ban_state
  when: mariadb_nftables_state.status.ActiveState == 'active'
  listen: Reload the firewall for the mariadb app hosts

- name: Restart fail2ban after the mariadb firewall change
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: restarted
  when:
    - mariadb_nftables_state.status.ActiveState == 'active'
    - mariadb_fail2ban_state.status.ActiveState == 'active'
  listen: Reload the firewall for the mariadb app hosts
