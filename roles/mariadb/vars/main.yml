# Internal values of luminare.infra_edge.mariadb (not meant to be overridden).

# Supported managed hosts: distribution -> major version.
mariadb_supported_platforms:
  Debian: ["13"]
  Ubuntu: ["24"]

# The Debian layout that both distributions use. The tuning file sorts after the package's
# 50-server.cnf (and 60-galera.cnf), so its values win.
mariadb_service: mariadb.service
mariadb_socket: /run/mysqld/mysqld.sock
mariadb_tuning_file: /etc/mysql/mariadb.conf.d/60-tuning.cnf
mariadb_log_dir: /var/log/mysql
# Covered by the package's logrotate rule for /var/log/mysql/*.log.
mariadb_slow_query_log_file: /var/log/mysql/mariadb-slow.log
mariadb_port: 3306

# Nightly dumps (docs/adr/0016)
mariadb_dump_script: /usr/local/sbin/mariadb-dump-all
mariadb_dump_service_file: /etc/systemd/system/mariadb-dump.service
mariadb_dump_timer_file: /etc/systemd/system/mariadb-dump.timer
# Databases of the server itself: never dumped one by one, never created or dropped by the role.
# "test" is dropped as in mysql_secure_installation, so it cannot be one of mariadb_databases.
mariadb_system_databases: [information_schema, mysql, performance_schema, sys]
mariadb_reserved_databases: [information_schema, mysql, performance_schema, sys, test]
# Accounts of the packages: root (unix_socket), mysql (unix_socket) and mariadb.sys.
mariadb_reserved_users: [root, mysql, mariadb.sys]

# Firewall drop-in of the base role's layout (docs/adr/0009): number 30 is the database's.
mariadb_firewall_dropin_dir: /etc/nftables.d
mariadb_firewall_dropin: /etc/nftables.d/30-mariadb.nft
mariadb_firewall_ruleset: /etc/nftables.conf

# Input checks (assert.yml). Values end up in configuration files, a unit file or a shell
# script, so they may not contain spaces, quotes, semicolons or other special characters.
mariadb_database_name_pattern: '^[A-Za-z0-9_]{1,64}$'
mariadb_user_name_pattern: '^[A-Za-z0-9_.-]{1,80}$'
# An account host: a name, an address, a netmask (192.0.2.0/255.255.255.0) or a % pattern.
mariadb_user_host_pattern: '^[A-Za-z0-9.%_:/-]{1,255}$'
# An IPv4 address, or an IPv6 address (at least two colons, so address:port is refused).
mariadb_address_pattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f.]*:[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*)$'
# The same, with a prefix length (written in two lines: the escaped line break adds nothing).
mariadb_cidr_pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3}(/[0-9]{1,2})?\
  |[0-9A-Fa-f.]*:[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*(/[0-9]{1,3})?)$"
mariadb_size_pattern: '^[1-9][0-9]*[KMGkmg]?$'
mariadb_charset_pattern: '^[a-z0-9_]{1,64}$'
# An absolute path whose parts start with a letter, digit or _ (no "." or ".." parts).
mariadb_path_pattern: '^(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$'
# The dump folder becomes root's with mode 0700, so it may not be a system or server folder.
mariadb_dump_dir_forbidden_pattern: '^/(etc|usr|bin|sbin|lib|lib64|boot|dev|proc|run|sys)(/|$)|^/var/lib/mysql(/|$)'
mariadb_oncalendar_pattern: '^[A-Za-z0-9*:,./~ -]+$'
