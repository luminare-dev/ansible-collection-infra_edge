# Input validation and documentation of luminare.infra_edge.mariadb. Ansible checks these options
# when the role starts (including the keys of every database item; passwords are marked no_log).
# The variable tables in roles/mariadb/README.md and docs/configuration.md are generated from this
# file (python3 tests/role_docs.py --write), and a unit test keeps them equal.
argument_specs:
  main:
    short_description: MariaDB from the distribution, secured, tuned, with databases, accounts and nightly dumps
    description:
      - Installs the distribution's MariaDB server, keeps root on unix_socket login without a password,
        removes anonymous accounts, the test database and root accounts for other hosts (what
        mysql_secure_installation does), writes a tuning file (bind address, character set, InnoDB sizes,
        connections, slow query log), creates databases and accounts from a list, dumps every database
        nightly into a zstd file per database with a retention, and can open port 3306 for application
        hosts in the firewall drop-in directory of the base role.
    author:
      - Luminare Development
    options:
      mariadb_packages:
        type: list
        elements: str
        default: [mariadb-server, python3-pymysql, zstd]
        description: >-
          Packages to install: the server (MariaDB 11.8 on Debian 13, 10.11 on Ubuntu 24.04), the Python
          driver that the ansible.mariadb modules need on the host, and zstd for the dumps. Add packages,
          do not remove these.
      mariadb_bind_address:
        type: str
        default: 127.0.0.1
        description: >-
          The one IPv4 or IPv6 address the server listens on (port 3306). The default keeps it on the
          host; set a private address for application hosts and list them in mariadb_allowed_app_hosts.
          The socket /run/mysqld/mysqld.sock always works.
      mariadb_databases:
        type: list
        elements: dict
        default: []
        description: >-
          Databases and their accounts. Keys: name (database; letters, digits and _), user and password
          (optional account; both or neither), host (where the account may connect from, default
          localhost, the socket) and priv (privileges in the ansible.mariadb.mariadb_user format, default
          all privileges on its own database, for example app.*:ALL for the database app). A changed
          password or priv is applied on the next run. Databases and accounts that leave the list are
          not dropped.
        options:
          name:
            type: str
            required: true
            description: Name of the database.
          user:
            type: str
            description: Account for the database (optional).
          password:
            type: str
            no_log: true
            description: Password of the account; required with user. Keep it encrypted (Ansible Vault, SOPS).
          host:
            type: str
            description: Host part of the account (default localhost; an address, a name, or a % pattern).
          priv:
            type: str
            description: >-
              Privileges of the account, for example app.*:SELECT,INSERT (default all privileges on the
              database of the item).
      mariadb_innodb_buffer_pool_ratio:
        type: float
        default: 0.25
        description: >-
          Share of the host's memory for the InnoDB buffer pool, used by the default of
          mariadb_innodb_buffer_pool_size (0.25 when the host also runs applications; 0.5 to 0.7 on a
          host for the database only; at most 0.9).
      mariadb_innodb_buffer_pool_size:
        type: str
        default: "{{ (ansible_facts['memtotal_mb'] * mariadb_innodb_buffer_pool_ratio) | int }}M"
        description: >-
          Size of the InnoDB buffer pool (a number with K, M or G). The default is the host's memory times
          mariadb_innodb_buffer_pool_ratio.
      mariadb_innodb_log_file_size:
        type: str
        default: 256M
        description: Size of the InnoDB redo log (a number with K, M or G).
      mariadb_max_connections:
        type: int
        default: 100
        description: Most client connections at the same time.
      mariadb_character_set_server:
        type: str
        default: utf8mb4
        description: Character set of new databases and tables.
      mariadb_collation_server:
        type: str
        default: ""
        description: >-
          Collation of new databases and tables. Empty keeps the package's utf8mb4 collation
          (utf8mb4_uca1400_ai_ci on Debian 13, utf8mb4_general_ci on Ubuntu 24.04); another character set
          needs a collation of that set here.
      mariadb_slow_query_log:
        type: bool
        default: true
        description: >-
          Log statements that run longer than mariadb_long_query_time to /var/log/mysql/mariadb-slow.log
          (the statements' text; rotated by the package's logrotate rule).
      mariadb_long_query_time:
        type: float
        default: 1
        description: Seconds after which a statement counts as slow.
      mariadb_dump_enabled:
        type: bool
        default: true
        description: >-
          Run the dump timer. False stops and disables it; the script and the service stay, so a dump can
          still be started by hand, and existing dumps are kept.
      mariadb_dump_dir:
        type: str
        default: /var/backups/mariadb
        description: >-
          Folder of the dumps (owner root, mode 0700). Every file in it that ends in .sql.zst counts as a
          dump for the retention.
      mariadb_dump_oncalendar:
        type: str
        default: "*-*-* 03:15:00"
        description: >-
          When the dumps run (systemd OnCalendar expression, local time of the host). A run missed while
          the host was off follows at the next boot.
      mariadb_dump_retention_days:
        type: int
        default: 2
        description: >-
          Days a dump is kept. After a successful run, dumps older than this are deleted; a failed run
          deletes nothing.
      mariadb_allowed_app_hosts:
        type: list
        elements: str
        default: []
        description: >-
          IPv4 and IPv6 addresses or CIDRs of the application hosts that may reach port 3306 through the
          firewall of the base role (never /0). The server must also listen on an address they reach
          (mariadb_bind_address), and their accounts need a matching host.
      mariadb_firewall_manage:
        type: bool
        default: false
        description: >-
          false writes /etc/nftables.d/30-mariadb.nft only when /etc/nftables.d exists (the firewall of the
          base role); true also creates the directory (nftables and /etc/nftables.conf must exist). The
          file holds accept rules for port 3306 from mariadb_allowed_app_hosts and is removed when the list
          is empty; a running nftables is restarted after a change.
