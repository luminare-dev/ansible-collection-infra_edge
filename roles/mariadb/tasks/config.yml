# The role adds one file to the package's configuration and leaves the package's files alone
# (they change with package updates). 60-tuning.cnf is read after 50-server.cnf, so its values
# win; a change restarts the server (handler), because most of the values are read at start-up.

- name: Create the folder of the slow query log
  ansible.builtin.file:
    path: "{{ mariadb_log_dir }}"
    state: directory
    owner: mysql
    group: adm
    mode: "2750"

- name: Write the tuning file (bind address, character set, InnoDB sizes, connections, slow query log)
  ansible.builtin.template:
    src: 60-tuning.cnf.j2
    dest: "{{ mariadb_tuning_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
