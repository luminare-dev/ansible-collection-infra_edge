# Input validation and documentation of luminare.infra_edge.restic_backup. Ansible checks these
# options when the role starts (the password and the backend credentials are marked no_log). The
# variable tables in roles/restic_backup/README.md and docs/configuration.md are generated from this
# file (python3 tests/role_docs.py --write), and a unit test keeps them equal.
argument_specs:
  main:
    short_description: Nightly restic backups to a repository, with retention, a monthly check and a restore test
    description:
      - Installs restic (the distribution's package or a pinned upstream release checked against its
        SHA-256), writes the repository, its password and the backend credentials to files that only root
        can read, initialises the repository if it does not exist yet, backs up a list of paths every night
        with a sandboxed systemd service and timer, applies a retention policy with forget --prune, checks
        the repository once a month, records the time of the last successful run (optionally as a metric
        for the node_exporter textfile collector), and installs a restore test that restores the newest
        snapshot into a temporary folder and compares it with the snapshot.
    author:
      - Luminare Development
    options:
      restic_backup_install_method:
        type: str
        choices: [package, binary]
        default: package
        description: >-
          package installs the distribution's restic (0.18 on Debian 13, 0.16 on Ubuntu 24.04, with the
          distribution's security updates); binary installs the upstream release restic_backup_version as
          /usr/local/bin/restic after checking its SHA-256 (restic_backup_binary_sha256). An installed
          package stays installed with binary; the jobs use the binary of the chosen method.
      restic_backup_version:
        type: str
        default: "0.19.1"
        description: >-
          Upstream release for restic_backup_install_method binary (x.y.z). Change it together with
          restic_backup_binary_sha256.
      restic_backup_binary_sha256:
        type: dict
        default:
          amd64: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
          arm64: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
        description: >-
          SHA-256 of the release file per architecture (amd64, arm64; for example
          `restic_0.19.1_linux_amd64.bz2`), as listed in the signed SHA256SUMS file of the release. Used
          only with the binary method; the role stops on a host whose architecture has no entry, and when
          the downloaded file does not match.
      restic_backup_repository:
        type: str
        default: ""
        description: >-
          Required. The restic repository of this host, for example
          `s3:https://s3.example.com/backups/edge-01`, `sftp:backup@example.com:/srv/restic/edge-01`,
          `rest:https://backup.example.com/edge-01/` or a local path such as `/srv/restic-repo` (a local
          path is for tests or a second disk, not an off-host backup). Give every host its own repository.
      restic_backup_password:
        type: str
        default: ""
        no_log: true
        description: >-
          Required. Password of the repository, written to /etc/restic/password (root only). Without it the
          snapshots cannot be read: keep a copy outside the host and the repository. Keep it encrypted (Ansible
          Vault, SOPS); no line break and no spaces at either end.
      restic_backup_env:
        type: dict
        default: {}
        no_log: true
        description: >-
          Environment variables for the backend, written to /etc/restic/env (root only), for example
          AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for an S3 bucket. Names in capitals; not the
          `RESTIC_REPOSITORY*`, `RESTIC_PASSWORD*` and `RESTIC_CACHE_DIR` variables, which the role sets
          itself.
          Keep the values encrypted (Ansible Vault, SOPS).
      restic_backup_paths:
        type: list
        elements: str
        default: [/etc, /var/backups]
        description: >-
          Absolute paths to back up (the default includes /var/backups/mariadb, the dumps of the mariadb
          role). Every path must exist when the backup runs: a missing path fails the run instead of being
          skipped. Folders tagged as caches (CACHEDIR.TAG) are left out.
      restic_backup_exclude:
        type: list
        elements: str
        default: []
        description: >-
          restic exclude patterns, one per line of /etc/restic/excludes, for example `/var/backups/*.tmp`
          or `*.log`. restic replaces `$NAME` with the environment variable NAME; write `$$` for a dollar
          sign.
      restic_backup_keep:
        type: dict
        default:
          daily: 7
          weekly: 4
          monthly: 6
        description: >-
          Retention of restic forget --prune after every backup, applied to the snapshots of this host only:
          how many of the newest snapshots to keep per kind (last, hourly, daily, weekly, monthly, yearly;
          at least one kind). The default keeps one snapshot per day for 7 days, per week for 4 weeks and
          per month for 6 months.
        options:
          last:
            type: int
            description: Keep the newest snapshots (--keep-last).
          hourly:
            type: int
            description: Keep the newest snapshot of this many hours (--keep-hourly).
          daily:
            type: int
            description: Keep the newest snapshot of this many days (--keep-daily).
          weekly:
            type: int
            description: Keep the newest snapshot of this many weeks (--keep-weekly).
          monthly:
            type: int
            description: Keep the newest snapshot of this many months (--keep-monthly).
          yearly:
            type: int
            description: Keep the newest snapshot of this many years (--keep-yearly).
      restic_backup_timers_enabled:
        type: bool
        default: true
        description: >-
          Run the backup and check timers. False stops and disables both; the services stay, so a backup can
          still be started by hand, and the repository is kept.
      restic_backup_oncalendar:
        type: str
        default: "*-*-* 03:45:00"
        description: >-
          When the backup runs (systemd OnCalendar expression, local time of the host); the default follows
          the dumps of the mariadb role at 03:15. A run missed while the host was off follows at the next
          boot.
      restic_backup_check_oncalendar:
        type: str
        default: monthly
        description: >-
          When restic check runs (systemd OnCalendar expression; monthly is the first day of each month at
          00:00). A run missed while the host was off follows at the next boot.
      restic_backup_check_read_data_subset:
        type: str
        default: ""
        description: >-
          Part of the stored data that the monthly check also reads and verifies (restic check
          --read-data-subset), as a percentage (for example 5%, a random part on each run) or a part n/t
          (for example 1/12). Empty checks the structure of the repository without reading the data.
      restic_backup_textfile_dir:
        type: str
        default: ""
        description: >-
          Folder of the node_exporter textfile collector (for example /var/lib/prometheus/node-exporter of
          Debian's prometheus-node-exporter package). When set, every successful run writes
          restic_backup.prom with the metric restic_backup_last_success_timestamp_seconds there; the role
          creates the folder if it is missing. Empty writes no metric.
      restic_backup_max_age_hours:
        type: int
        default: 26
        description: >-
          The restore test fails when the newest snapshot of the host is older than this many hours. The
          default allows one nightly run plus two hours; an alert on the metric can use the same limit.
      restic_backup_restore_test_include:
        type: list
        elements: str
        default: []
        description: >-
          Paths that the restore test restores and compares, each inside one of restic_backup_paths. Empty
          restores the whole snapshot, which needs that much free space in restic_backup_restore_test_dir.
      restic_backup_restore_test_dir:
        type: str
        default: /var/tmp
        description: >-
          Existing folder in which the restore test creates its temporary folder (mode 0700); the folder is
          removed after the test.
