# Collections the base role needs in the Molecule run (installed by the dependency step).
# devsec.hardening comes from Ansible Galaxy with the same version range as in galaxy.yml; its
# own dependencies (ansible.posix, community.crypto, community.general, community.mysql) are
# already installed from the hash-pinned "ansible" package in requirements-test.txt.
collections:
  - name: devsec.hardening
    version: ">=11.0.0,<12.0.0"
