# Tags do not filter handlers, so the handlers that load the firewall or restart fail2ban check
# the skipped tags themselves: Molecule skips "molecule-notest", and an operator may skip
# "firewall" or "fail2ban".

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
  when: ansible_skip_tags | intersect(['molecule-notest', 'firewall']) | length == 0
  # Restarting nftables flushes the ruleset, including the table of fail2ban.
  notify: Restart fail2ban

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when:
    - base_fail2ban_enabled
    - ansible_skip_tags | intersect(['molecule-notest', 'fail2ban']) | length == 0
