- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit the size and age of the journal
  ansible.builtin.template:
    src: journald-retention.conf.j2
    dest: /etc/systemd/journald.conf.d/10-retention.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
