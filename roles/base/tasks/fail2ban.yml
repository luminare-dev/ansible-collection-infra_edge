# fail2ban reads failed SSH logins from the systemd journal and bans the address with an
# nftables set in its own table. The configuration is written and checked everywhere; starting
# the service is skipped in Molecule (tag molecule-notest).

- name: Configure the fail2ban SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  tags: [fail2ban, molecule-notest]
