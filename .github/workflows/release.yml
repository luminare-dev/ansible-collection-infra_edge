# Caller: release-please on every push to main. Skipped in the template repository itself
# (a repository marked as a template), so only repositories created from it make releases.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".
# The release carries the source archive and the collection tarball built by ansible-galaxy
# (luminare-infra_edge-X.Y.Z.tar.gz), both listed in SHA256SUMS and attested.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.repository.is_template }}
    uses: ./.github/workflows/reusable-release.yml
    with:
      # The build job runs on the bare runner Python, so the test tools get their own venv.
      test-command: >-
        python3 -m venv "$RUNNER_TEMP/venv"
        && export PATH="$RUNNER_TEMP/venv/bin:$PATH"
        && pip install --quiet --require-hashes --only-binary=:all: -r requirements-test.txt
        && python3 -m unittest discover -s tests -v
        && ansible-lint --offline
    permissions:
      contents: write        # release commit, tag, draft release, attached files
      pull-requests: write   # the release pull request
      issues: write          # release-please labels
      id-token: write        # Sigstore certificate for the attestation
      attestations: write    # store the attestation
