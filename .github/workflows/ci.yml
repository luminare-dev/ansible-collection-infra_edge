# Lint, tests and the secret scan on every pull request and push to main; Molecule on pull
# requests, on demand and weekly. Required checks: "ci / lint-test" and "secrets / gitleaks".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"   # Tuesdays 03:41 UTC: the roles against the current distribution packages
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Unit tests and ansible-lint --offline (no Galaxy downloads); the checkout is installed
      # first without dependencies so the edge playbook resolves luminare.infra_edge.*.
      test-command: >-
        pip install --quiet --require-hashes --only-binary=:all: -r requirements-test.txt
        && python3 -m unittest discover -s tests -v
        && ansible-galaxy collection install --no-deps --force .
        && ansible-lint --offline
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  # Molecule: a role x platform matrix over the roles that have roles/<role>/molecule/default/
  # molecule.yml; each job tests one role on one platform of .config/molecule/config.yml
  # (Debian 13 or Ubuntu 24.04). Not run on pushes to main, where the same commit already passed
  # as a pull request.
  plan:
    name: molecule-plan
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roles: ${{ steps.list.outputs.roles }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the roles with a Molecule scenario
        id: list
        run: |
          set -euo pipefail
          roles=$(find roles -mindepth 4 -maxdepth 4 -path 'roles/*/molecule/default/molecule.yml' \
            | cut -d/ -f2 | sort | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "roles=${roles}" >> "$GITHUB_OUTPUT"
          echo "Roles with a Molecule scenario: \`${roles}\`" >> "$GITHUB_STEP_SUMMARY"

  molecule-scenario:
    name: molecule-scenario (${{ matrix.role }}, ${{ matrix.platform }})
    needs: plan
    if: ${{ needs.plan.outputs.roles != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.plan.outputs.roles) }}
        # The platform suffixes of .config/molecule/config.yml (instance ie-<role>-<platform>);
        # tests/test_collection.py keeps both lists equal.
        platform: [debian13, ubuntu2404]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the test tools (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r requirements-test.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: molecule test on one platform
        working-directory: roles/${{ matrix.role }}
        env:
          MOLECULE_ROLE: ${{ matrix.role }}
          PLATFORM: ${{ matrix.platform }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test --platform-name "ie-${MOLECULE_ROLE}-${PLATFORM}"

  # The playbook luminare.infra_edge.edge with the example inventory: the collection scenario
  # extensions/molecule/edge, run from the repository root, one job per platform (instance
  # ie-edge-<platform>; tests/test_collection.py keeps the platforms equal to config.yml).
  molecule-edge:
    name: molecule-edge (${{ matrix.platform }})
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [debian13, ubuntu2404]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the test tools (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r requirements-test.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: molecule test of the edge playbook on one platform
        env:
          PLATFORM: ${{ matrix.platform }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test --scenario-name edge --platform-name "ie-edge-${PLATFORM}"

  molecule:
    # One stable check name for all Molecule jobs: fails when the plan, any role x platform job or
    # any edge job failed or was cancelled; passes when every job passed (the role jobs may be
    # skipped only when no role has a scenario).
    name: molecule
    needs: [plan, molecule-scenario, molecule-edge]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the scenario results
        env:
          PLAN: ${{ needs.plan.result }}
          SCENARIOS: ${{ needs.molecule-scenario.result }}
          EDGE: ${{ needs.molecule-edge.result }}
          ROLES: ${{ needs.plan.outputs.roles }}
        run: |
          set -euo pipefail
          echo "plan: ${PLAN}; scenarios: ${SCENARIOS}; edge: ${EDGE}; roles: ${ROLES:-none}"
          if [ "$PLAN" != "success" ]; then
            echo "::error::the Molecule plan job did not succeed (${PLAN})"
            exit 1
          fi
          if [ "$EDGE" != "success" ]; then
            echo "::error::the edge playbook scenario did not pass (${EDGE})"
            exit 1
          fi
          case "$SCENARIOS" in
            success) ;;
            skipped)
              if [ "$ROLES" != "[]" ]; then
                echo "::error::role scenarios were skipped although roles were listed: ${ROLES}"
                exit 1
              fi
              echo "No role has a Molecule scenario."
              ;;
            *)
              echo "::error::at least one role scenario did not pass (${SCENARIOS})"
              exit 1
              ;;
          esac
