# release-please keeps a release PR open; merging it creates a draft release that this run fills
# with the archives, SHA256SUMS and an attestation, then publishes.
name: reusable-release

on:
  workflow_call:
    inputs:
      archive-name:
        description: Name of the source archive (default the repository name, lower-cased).
        type: string
        default: ""
      test-command:
        description: Run before packaging; the release fails if the tests fail on the tag.
        type: string
        default: python3 -m unittest discover -s tests -v
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # release commit, tag and draft release
      pull-requests: write   # open and update the release pull request
      issues: write          # labels such as "autorelease: pending"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Tests on the tag
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Source archive and SHA256SUMS
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE_NAME: ${{ inputs.archive-name || github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --ref HEAD --version "${TAG#v}" --name "$ARCHIVE_NAME" --out dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Collection tarball (ansible-galaxy collection build) and SHA256SUMS of both archives
        if: ${{ hashFiles('galaxy.yml') != '' }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/galaxy-venv"
          export PATH="$RUNNER_TEMP/galaxy-venv/bin:$PATH"
          pip install --quiet --require-hashes --only-binary=:all: -r requirements-test.txt
          meta=$(python3 -c 'import yaml; g = yaml.safe_load(open("galaxy.yml"))
          print(g["namespace"], g["name"], g["version"])')
          read -r namespace name version <<< "$meta"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error file=galaxy.yml::galaxy.yml has version ${version}, the tag is ${TAG}"
            exit 1
          fi
          tarball="${namespace}-${name}-${version}.tar.gz"
          ansible-galaxy collection build --output-path dist
          # Smoke install into an empty path that is the only collections path, so that a copy in
          # a default path cannot turn the install into "Nothing to do".
          ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/installed" \
            ansible-galaxy collection install --no-deps -p "$RUNNER_TEMP/installed" "dist/${tarball}"
          test -f "$RUNNER_TEMP/installed/ansible_collections/${namespace}/${name}/MANIFEST.json"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # attach files and publish the draft release
      id-token: write        # Sigstore certificate for the attestation
      attestations: write    # store the attestation
    steps:
      - name: Fetch the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
