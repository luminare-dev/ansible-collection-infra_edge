# luminare.infra_edge.edge: one edge host with base, cloudflared, nginx, mariadb and, when
# edge_restic_backup_enabled is true, restic_backup. Hosts: group "edge" or -e edge_hosts=<pattern>.
# Every value comes from the inventory; see examples/edge/ and docs/configuration.md.
- name: Set up the edge host
  hosts: "{{ edge_hosts | default('edge') }}"
  become: true
  gather_facts: true
  roles:
    - role: luminare.infra_edge.base
    - role: luminare.infra_edge.cloudflared
    - role: luminare.infra_edge.nginx
    - role: luminare.infra_edge.mariadb
    - role: luminare.infra_edge.restic_backup
      when: edge_restic_backup_enabled | default(false) | bool
