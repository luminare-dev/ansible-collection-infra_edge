# Shared Molecule configuration; each scenario's molecule.yml is merged on top of it.
#   cd roles/<role> && export MOLECULE_ROLE=<role> && molecule test [--platform-name ie-<role>-debian13]
# MOLECULE_ROLE goes into the instance names, so several roles can run on one Docker daemon.
# tests/test_collection.py keeps the ci.yml matrix equal to the platforms below.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The same container settings for both platforms: systemd as PID 1 needs a
  # privileged container that shares the host cgroup namespace.
  - name: ie-${MOLECULE_ROLE:-role}-debian13
    image: ie-molecule-debian13
    dockerfile: ../../../../.config/molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups:
      - debian
  - name: ie-${MOLECULE_ROLE:-role}-ubuntu2404
    image: ie-molecule-ubuntu2404
    dockerfile: ../../../../.config/molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups:
      - ubuntu
provisioner:
  name: ansible
ansible:
  cfg:
    defaults:
      callback_result_format: yaml
verifier:
  name: ansible
scenario:
  # One extra "destroy" before "syntax" removes the containers of an aborted earlier run.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
