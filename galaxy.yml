# Collection metadata (https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html).
# The version is set by release-please (release-please-config.json, generic updater on the
# annotated line) and must stay equal to version.txt; tests/test_collection.py checks both.
namespace: luminare
name: infra_edge
version: 0.2.0 # x-release-please-version
readme: README.md
authors:
  - Luminare Development <oss@luminare.tech>
description: "Ansible collection for edge hosts: base hardening, an outbound tunnel, a web server and a database"
license:
  - Apache-2.0
tags:
  - infrastructure
  - linux
  - security
  - hardening
  - networking
  - tunnel
  - web
  - database
  - backup
  - debian
  - ubuntu
# Only community collections that a role really uses go here, each with a version range (the
# tested versions: ansible.mariadb, ansible.posix and community.general from the "ansible" package
# in requirements-test.txt, devsec.hardening from Galaxy). luminare collections are never listed.
dependencies:
  ansible.mariadb: ">=6.0.0,<7.0.0"
  ansible.posix: ">=2.2.0,<3.0.0"
  community.general: ">=13.0.0,<14.0.0"
  devsec.hardening: ">=11.0.0,<12.0.0"
repository: https://github.com/luminare-dev/ansible-collection-infra_edge
documentation: https://github.com/luminare-dev/ansible-collection-infra_edge/tree/main/docs
homepage: https://luminare.tech/open-source/ansible-collection-infra_edge/
issues: https://github.com/luminare-dev/ansible-collection-infra_edge/issues
# Repository files that are not part of the installed collection (tooling, CI, brand, tests of
# the repository scripts, caches and build output). Patterns match paths from the repository root.
build_ignore:
  - .ansible
  - roles/*/.ansible
  - .ansible-lint
  - .cache
  - .config
  - .forbidden-words-allow
  - .gitattributes
  - .github
  - .gitignore
  - .gitleaks.toml
  - .markdownlint-cli2.jsonc
  - .release-please-manifest.json
  - .venv
  - .yamllint.yml
  - "*.tar.gz"
  - dist
  - docs/brand
  # extensions/ holds only the collection's Molecule scenario (the edge playbook); see also
  # roles/*/molecule below.
  - extensions
  - release-please-config.json
  - requirements-*.in
  - requirements-*.txt
  - roles/*/molecule
  - scripts
  # The repository's own tests (scripts, metadata, build); the collection has no ansible-test
  # tests yet. Ignoring the whole folder also keeps an empty tests/ out of the tarball.
  - tests
  - version.txt
