# Molecule scenario "edge": the edge playbook with the example inventory's group_vars.
#   molecule test --scenario-name edge [--platform-name ie-edge-debian13]
# Driver and sequence come from .config/molecule/config.yml; only the platforms are repeated here
# (tests/test_collection.py keeps both lists equal).
dependency:
  name: galaxy
  options:
    # devsec.hardening for the base role, as in roles/base/molecule/default/requirements.yml.
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
platforms:
  - name: ie-edge-debian13
    image: ie-molecule-debian13
    dockerfile: ../../../.config/molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups:
      - edge
      - debian
  - name: ie-edge-ubuntu2404
    image: ie-molecule-ubuntu2404
    dockerfile: ../../../.config/molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups:
      - edge
      - ubuntu
provisioner:
  name: ansible
  options:
    # Unlike the role scenarios, the tasks tagged molecule-notest run here: the base role loads its
    # firewall into the instance's own network namespace and starts fail2ban, and the drop-in
    # handlers of the other roles restart both, as on a real host.
    skip-tags: notest
  inventory:
    links:
      group_vars: ../../../examples/edge/group_vars/
scenario:
  name: edge
